name: Backend CI

on:
  pull_request:
    paths: ['service/**']
  push:
    branches: [main]
    paths: ['service/**']

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wakeel_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: service/package-lock.json

      - name: Install dependencies
        working-directory: service
        run: npm ci

      - name: Generate Prisma client
        working-directory: service
        run: npx prisma generate

      - name: Run migrations
        working-directory: service
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/wakeel_test

      - name: Type check
        working-directory: service
        run: npx tsc --noEmit

      - name: Run unit tests
        working-directory: service
        run: npm run test:unit
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/wakeel_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-not-real
          JWT_REFRESH_SECRET: ci-test-refresh-secret-not-real

      - name: Run integration tests
        working-directory: service
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/wakeel_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-not-real
          JWT_REFRESH_SECRET: ci-test-refresh-secret-not-real
